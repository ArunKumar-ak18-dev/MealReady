<DOCTYPE html>
 <html>
    <head>
        <title>Adding Items</title>
         {% load static %}
    <link rel="stylesheet" href="{% static 'add_item.css' %}">
    </head>
    <body>
            {% for item in itemList %}
                <h3> {{item.name}} </h3>
                <img src="{{item.picture}}" width="100px">
                <p> {{item.description}}</p>
                <h3>{{item.veg}}</h3>
                <h2>{{item.price}}</h2>

            {% endfor %}

       <form action="{% url 'add_items' restaurant.id %}" method="POST">
  
             {% csrf_token %}
             <label>Dish Name:</label>
             <input type="text" name="name" id="name" required>
              <br>
              <label for="description">Description:</label>
              <textarea id="description" name="description" ></textarea>
              <br>
              <label for="price">Price:</label>
              <input type="number" id="price" name="price">
              <br>
              <label for="vegeterian">Vegeterian:</label>
              <input type="checkbox" name="vegeterian">
              <br>
              <label for="picture">Image URL:</label>
              <input type="url" name="picture">
              <br>
              <button type="submit"> add item</button>
        </form>
    </body>
 </html>
